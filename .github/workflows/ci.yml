name: validacion pagina

on: 
  push:
    branches: [eduardo]
  pull_request:
    branches: [eduardo]

jobs:
  validacion:
    name: crear maquina virtual
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: instalar node
        uses: docker/setup-node@v4
        with:
          node-version: '22'