name: validacion pagina

on: 
  push:
    branches: [eduardo,main]
  pull_request:
    branches: [eduardo,main]

jobs:
  validacion:
    name: crear maquina virtual
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: instalar node
        uses: docker/setup-node@v4
        with:
          node-version: '22'

      - name: validar codigo HTML
        run: |
          echo "inicio"
          npx html-validate "**/*.html"
          echo "fin"